<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MonkuGames</title>
<style>
:root{--bg:#fbf4e2;--fg:#2a1d3a;--card:#fffdf6;--ac:#d6285a;--ac2:#1e5fd4;--down:#cfc6dc;--bd:#e3d6b4;--sea:#d4e4ff;--ship:#5b6b8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1630;--fg:#f4ecff;--card:#2b2145;--ac:#ff5c8a;--ac2:#7fa8ff;--down:#4a3f68;--bd:#44385f;--sea:#2c3b6b;--ship:#9aa7c7}}
:root[data-theme="dark"]{--bg:#1d1630;--fg:#f4ecff;--card:#2b2145;--ac:#ff5c8a;--ac2:#7fa8ff;--down:#4a3f68;--bd:#44385f;--sea:#2c3b6b;--ship:#9aa7c7}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
main{max-width:1240px;margin:0 auto;padding:14px 14px 70px}
h1{font:800 clamp(30px,7vw,48px)/1 "Arial Black","Impact",sans-serif;margin:6px 0 12px;letter-spacing:-1px;color:var(--ac);transform:rotate(-1.5deg)}
h2{font-size:18px;margin:4px 0 10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
button,.btn{font:inherit;font-weight:700;border:2px solid var(--fg);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:10px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
button.on{background:var(--fg);color:var(--bg)}
button.go,.btn.go{background:var(--ac);color:#fff;border-color:var(--ac)}
.badge{background:var(--ac2);color:#fff;border-radius:20px;padding:4px 12px;font-weight:800;font-size:14px}
.codebox{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--fg);border-radius:10px;padding:4px 6px;margin-bottom:10px}
.codebox b{font:800 20px/1 monospace;letter-spacing:4px;min-width:96px;text-align:center}
.ib{padding:4px 8px;border-width:1px;border-radius:8px}
.secret{display:flex;align-items:center;gap:12px;background:var(--card);border:2px dashed var(--bd);border-radius:12px;padding:10px;margin-bottom:12px}
.secret .c{width:72px;flex:none}
.msg{font-weight:800;font-size:18px;margin:0 0 12px;min-height:1.4em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.menu{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.c{background:var(--card);border:3px solid var(--fg);border-radius:12px;padding:5px;text-align:center;cursor:pointer;position:relative;font:inherit;color:var(--fg)}
.c img,.q{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px;display:block}
.q{background:var(--ac2);color:#fff;display:grid;place-items:center;font:800 40px "Arial Black",sans-serif}
.c span{display:block;font-weight:700;font-size:14px;padding-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c small{display:block;font-size:12px;opacity:.7}
.menu .c:hover{border-color:var(--ac)}
.c.down{background:var(--down);border-color:var(--down);transform:perspective(300px) rotateX(18deg) scale(.94)}
.c.down img{filter:grayscale(1) opacity(.25)}
.c.down span{opacity:.5}
.guessing .c:hover{border-color:var(--ac)}
.edit .c{cursor:default}
input[type=text],input[type=password],select{font:inherit;font-size:15px;padding:7px 9px;border:2px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);min-width:0;max-width:100%}
.edit input[type=text]{width:100%;font-size:14px;margin-top:3px;padding:3px}
.x{position:absolute;top:-8px;right:-8px;width:28px;height:28px;padding:0;border-radius:50%;background:var(--ac);color:#fff;border-color:var(--card)}
.empty{padding:28px 14px;text-align:center;
border:2px dashed var(--bd);border-radius:12px;margin-bottom:12px}
.hint{opacity:.75;font-size:14px;margin:4px 0 10px}
.box{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:14px}
.log{max-height:180px;overflow:auto;margin-bottom:12px}
.log div{padding:4px 0;border-bottom:1px solid var(--bd)}
.bsw{text-align:center}.bsw .bar{justify-content:center}
.seas{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.seas>div{flex:0 1 540px;max-width:max(280px,min(540px,calc(100vh - 380px)))}
.sea{position:relative;display:grid;grid-template-columns:repeat(10,1fr);gap:3px;max-width:max(280px,min(540px,calc(100vh - 380px)));width:100%;margin:0 auto}
.w{aspect-ratio:1;padding:0;border:1px solid var(--bd);border-radius:4px;background:var(--sea);color:var(--fg);font-size:14px;line-height:1}
.w:disabled{color:var(--fg);opacity:1;cursor:default}
.w:not(:disabled){cursor:crosshair}
.w:not(:disabled):hover{background:var(--ac2);opacity:.6}
.lay{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:2px;pointer-events:none}
.ship{position:relative;margin:3px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.drown{place-self:stretch;margin:3px;--w:color-mix(in srgb,var(--sea) 78%,transparent);animation:drown 3.4s linear both;animation-delay:var(--d,0ms)}
.drown.h{clip-path:polygon(2% 18%,78% 18%,100% 50%,78% 82%,2% 82%);background:linear-gradient(to right,transparent 50%,var(--w) 50%);background-size:200% 100%}
.drown.v{clip-path:polygon(18% 2%,82% 2%,82% 78%,50% 100%,18% 78%);background:linear-gradient(to bottom,transparent 50%,var(--w) 50%);background-size:100% 200%}
@keyframes drown{0%,30%{background-position:0 0;opacity:1}92%{background-position:100% 100%;opacity:1}100%{background-position:100% 100%;opacity:0}}
.ship.h{background:linear-gradient(180deg,#a9b5d3,#5b6a90 55%,#3a4668);clip-path:polygon(2% 18%,78% 18%,100% 50%,78% 82%,2% 82%)}
.ship.v{background:linear-gradient(90deg,#a9b5d3,#5b6a90 55%,#3a4668);clip-path:polygon(18% 2%,82% 2%,82% 78%,50% 100%,18% 78%)}
.ship::after{content:"";position:absolute;background:#e4e9f7;border-radius:3px}
.ship.h::after{left:28%;top:32%;width:24%;height:36%}
.ship.v::after{top:28%;left:32%;height:24%;width:36%}
.drop{animation:drop .9s cubic-bezier(.3,1.5,.5,1) both}
.sink{animation:sink 3.4s ease-in both;animation-delay:var(--d,0ms)}
.xboom{place-self:center;width:120%;height:320%;border-radius:50%;background:radial-gradient(ellipse,#fff 0 8%,#ffe066 18%,#ff9a1f 38%,#ff3d00 55%,rgba(255,61,0,0) 70%);animation:xboom 1s ease-out both;animation-delay:var(--d,0ms)}
.smoke{place-self:stretch;position:relative}
.smoke::before,.smoke::after{content:"";position:absolute;left:5%;right:25%;top:-20%;height:140%;background:radial-gradient(circle at 25% 55%,rgba(25,25,30,.9) 0 20%,transparent 21%),radial-gradient(circle at 55% 40%,rgba(45,45,50,.85) 0 25%,transparent 26%),radial-gradient(circle at 80% 60%,rgba(20,20,25,.85) 0 17%,transparent 18%);filter:blur(1.5px);animation:smoke 2.6s ease-out both;animation-delay:calc(var(--d,0ms) + 250ms)}
.smoke::after{left:25%;right:5%;animation-delay:calc(var(--d,0ms) + 700ms)}
.bubbles{place-self:stretch;background:radial-gradient(circle at 62% 55%,rgba(255,255,255,.95) 0 3px,transparent 4px),radial-gradient(circle at 74% 30%,rgba(255,255,255,.85) 0 2px,transparent 3px),radial-gradient(circle at 86% 62%,rgba(255,255,255,.95) 0 4px,transparent 5px),radial-gradient(circle at 93% 38%,rgba(255,255,255,.8) 0 2px,transparent 3px),radial-gradient(circle at 45% 70%,rgba(255,255,255,.8) 0 2px,transparent 3px);animation:bubbles 3.4s ease-out both;animation-delay:var(--d,0ms)}
@keyframes xboom{0%{transform:scale(.1);opacity:1}45%{transform:scale(1);opacity:.95}100%{transform:scale(1.3);opacity:0}}
@keyframes smoke{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:.95}100%{opacity:0;transform:translateY(-150%) scale(1.7)}}
@keyframes bubbles{0%,45%{opacity:0;transform:translateY(25%)}62%{opacity:1}100%{opacity:0;transform:translateY(-30%)}}
.wreck{opacity:.25;filter:brightness(.7) sepia(.5)}
.fire{place-self:center;font-style:normal;font-size:clamp(14px,3.8vw,26px);line-height:1;transform-origin:50% 90%;filter:drop-shadow(0 0 6px #ff9a1f);animation:flame .6s ease-in-out infinite alternate}
.boom{place-self:center;width:280%;height:280%;border-radius:50%;background:radial-gradient(circle,#fff 0 10%,#ffe066 20%,#ff9a1f 40%,#ff3d00 58%,rgba(255,61,0,0) 72%);animation:boom .8s ease-out both}
.miss{place-self:center;width:30%;height:30%;border-radius:50%;background:rgba(255,255,255,.9);border:2px solid var(--ac2)}
.miss.new{animation:splash .7s ease-out both}
.foam{place-self:center;font-style:normal;font-size:clamp(16px,4vw,28px);animation:foam 2.6s ease-out both}
@keyframes drop{0%{transform:translateY(-170%) scale(1.35);opacity:0}55%{opacity:1}100%{transform:none;opacity:1}}
@keyframes sink{0%{transform:none;opacity:1;filter:brightness(2.4) saturate(.3)}4%{transform:translate(4%,-3%)}8%{transform:translate(-4%,3%)}12%{transform:translate(3%,2%);filter:brightness(1.5)}16%{transform:translate(-2%,-1%)}30%{transform:none;filter:brightness(.7) sepia(.5);opacity:1}94%{opacity:1}100%{transform:none;filter:brightness(.7) sepia(.5);opacity:.25}}
@keyframes flame{from{transform:scale(.82) rotate(-5deg)}to{transform:scale(1.15) rotate(5deg)}}
@keyframes boom{0%{transform:scale(.1);opacity:1}55%{transform:scale(1);opacity:.95}100%{transform:scale(1.35);opacity:0}}
@keyframes splash{0%{transform:scale(2.4);opacity:0}30%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes foam{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:translateY(-30%) scale(1.5)}}
@media(prefers-reduced-motion:reduce){.xboom,.smoke,.bubbles,.drown{display:none}.drop,.sink,.fire,.miss.new,.foam{animation:none!important}.boom{display:none}}
.lock{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:34px;height:34px;padding:0;border-radius:50%;border-width:1px;opacity:.3;font-size:15px;line-height:1}
.lock:hover,.lock:focus-visible{opacity:1}
#modal{position:fixed;inset:0;background:rgba(20,10,40,.6);display:grid;place-items:center;padding:16px;z-index:10}
.dlg{background:var(--card);border:3px solid var(--fg);border-radius:14px;padding:16px;max-width:340px;width:100%}
.dlg input{width:100%;margin:6px 0}
.err{color:var(--ac);font-weight:700;min-height:1.4em;margin:2px 0 6px}
#net .empty{font-size:clamp(20px,3.6vw,30px);font-weight:800;padding:40px 16px}
#net .empty b{color:var(--ac);font-size:1.15em}
#net .empty small{display:block;font-size:16px;font-weight:600;opacity:.75;margin-top:8px}
#ps{font-size:20px;font-weight:700;padding:10px 12px}
.bwrap{display:flex;justify-content:center;margin:0 0 8px}
.bottom{text-align:center;margin:20px 0 14px}.bottom .msg{font-size:22px;margin:8px 0}.bottom .hint{font-size:17px;opacity:.85;margin:4px 0}
.banner{display:inline-block;max-width:100%;text-align:center;font:900 clamp(22px,5vw,36px)/1.1 "Arial Black","Impact",sans-serif;padding:14px 26px;border-radius:16px;border:3px solid var(--fg);box-shadow:0 8px 24px rgba(0,0,0,.35);animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.banner.turn{background:var(--ac2);color:#fff;font-size:clamp(24px,5vw,40px);padding:12px 26px}
.banner.wait{background:#f0a020;color:#2a1d3a;font-size:clamp(24px,5vw,40px);padding:12px 26px}
.banner.win{background:#1fa463;color:#fff;font-size:clamp(24px,5vw,40px);padding:12px 26px}
.banner.lose{background:var(--ac);color:#fff;font-size:clamp(24px,5vw,40px);padding:12px 26px}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.banner.nopop{animation:none}
@media(prefers-reduced-motion:reduce){.banner{animation:none}}

.codein{display:inline-flex;align-items:center;gap:6px}.codein input{letter-spacing:3px;font-weight:700;width:150px}.codein .ib{padding:6px 9px}
@media(max-width:600px){
 #net .qeg{grid-template-columns:repeat(6,1fr);gap:5px}
 #net .qeg .c{padding:2px;border-width:2px;border-radius:8px}
 #net .qeg .c img{border-radius:5px}
 #net .qeg .c span{font-size:10px;padding-top:1px}
 #net .secret{padding:6px 8px;gap:10px;margin-bottom:8px}
 #net .secret .c{width:46px;border-width:2px;padding:2px}
 #net .secret .q{font-size:24px}
 #net .secret .bar button{padding:4px 10px}
 #net .bottom{margin:8px 0}
 #net .banner{font-size:22px!important;padding:8px 18px!important}
 h1{font-size:28px;margin:2px 0 8px}
 #net .bar{margin-bottom:8px}
}
[hidden]{display:none!important}
</style></head><body><main>
<h1>MonkuGames</h1>
<div class="bar" id="adm" hidden><span class="badge">Mode admin</span><button id="th" onclick="go('hub')">Accueil</button><button id="te" onclick="go('edit')">Gérer les Qui est-ce ?</button></div>
<section id="hub"></section>
<section id="mode" hidden></section>
<section id="jform" hidden></section>
<section id="net" hidden></section>
<section id="edit" hidden></section>
</main>
<button class="lock" id="lock" onclick="lockClick()" aria-label="Mode admin">🔒</button>
<div id="modal" hidden><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="mt">
<b id="mt"></b><div class="hint" id="mh"></div>
<input type="password" id="pw" autocomplete="off" aria-label="Mot de passe" onkeydown="if(event.key==='Enter')submitPw();if(event.key==='Escape')closeModal()">
<input type="password" id="pw2" autocomplete="off" placeholder="Confirmer le mot de passe" aria-label="Confirmer" onkeydown="if(event.key==='Enter')submitPw();if(event.key==='Escape')closeModal()">
<div class="err" id="pe" aria-live="polite"></div>
<div class="bar"><button class="go" onclick="submitPw()">Valider</button><button onclick="closeModal()">Annuler</button></div>
</div></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=s=>document.getElementById(s);
let D={decks:[],cur:null,pw:null,pseudo:''},loaded=false,admin=false,view='hub',gid=null,NET=null,cd=0;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* Stockage : IndexedDB, repli sur localStorage */
const DB=()=>new Promise((res,rej)=>{const r=indexedDB.open('quiestce',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbGet(){const db=await DB();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get('data');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbSet(v){const db=await DB();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,'data');t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function save(){const copy=JSON.parse(JSON.stringify(D));try{await idbSet(copy)}catch(e){try{localStorage.setItem('qe_data',JSON.stringify(copy))}catch(e2){}}}
async function init(){
 let d=null;
 try{d=await idbGet()}catch(e){}
 if(!d){try{d=JSON.parse(localStorage.getItem('qe_data'))}catch(e){}}
 if(!d){d={};try{const old=JSON.parse(localStorage.getItem('qe_photos')||'[]');if(old.length){const id=uid();d.decks=[{id,name:'Mes photos',photos:old}];d.cur=id}}catch(e){}}
 D=Object.assign({decks:[],cur:null,pw:null,pseudo:''},d);
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 loaded=true;render();
}
/* Mot de passe admin (verrou simple, stocké sous forme de hash) */
async function hash(p,s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s+p)h=(h*33^c.charCodeAt(0))>>>0;return 'f'+h}}
function lockClick(){if(admin){admin=false;if(view==='edit')view='hub';render();return}openModal()}
function openModal(){const first=!D.pw;$('mt').textContent=first?'Crée ton mot de passe admin':'Mode admin';$('mh').textContent=first?'Choisis un mot de passe (4 caractères minimum). Il te sera demandé à chaque passage en mode admin.':'Entre le mot de passe pour modifier les jeux.';$('pw').value='';$('pw2').value='';$('pw2').hidden=!first;$('pe').textContent='';$('modal').hidden=false;$('pw').focus()}
function closeModal(){$('modal').hidden=true}
async function submitPw(){const v=$('pw').value;
 if(!D.pw){if(v.length<4){$('pe').textContent='4 caractères minimum.';return}if(v!==$('pw2').value){$('pe').textContent='Les deux mots de passe sont différents.';return}const salt=uid();D.pw={salt,hash:await hash(v,salt)};await save()}
 else if(await hash(v,D.pw.salt)!==D.pw.hash){$('pe').textContent='Mot de passe incorrect.';$('pw').select();return}
 admin=true;view='edit';closeModal();render()}
async function changePw(){const v=$('np').value;if(v.length<4){$('pm').textContent='4 caractères minimum.';return}const salt=uid();D.pw={salt,hash:await hash(v,salt)};await save();$('np').value='';$('pm').textContent='Mot de passe modifié.'}
/* ====== Réseau commun à tous les modes (héberger / rejoindre) ====== */
const CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const mkCode=()=>[...Array(5)].map(()=>CH[Math.floor(Math.random()*CH.length)]).join('');
const send=d=>{const c=NET&&NET.conn;if(c&&c.open){try{c.send(d)}catch(e){}}};
const PID=c=>'monkugames-'+c.toLowerCase();
function pickGame(k){gid=k;view='mode';render()}
function hostGo(){const n=NET={g:gid,role:'host',code:mkCode(),pseudo:D.pseudo||'',phase:'lobby',show:false,opp:null,oppName:'',pr:false,err:'',cp:''};GAMES[gid].init(n);view='net';render();connect(n)}
function joinGo(){const p=$('jp').value.trim().slice(0,16),c=$('jc').value.trim().toUpperCase();
 if(!p){$('je').textContent='Le pseudo est obligatoire.';return}
 if(!/^[A-Z0-9]{5}$/.test(c)){$('je').textContent='Le code est obligatoire : 5 caractères (lettres et chiffres).';return}
 D.pseudo=p;save();const n=NET={g:gid,role:'join',code:c,pseudo:p,phase:'lobby',opp:null,oppName:'',pr:false,err:'',deck:{name:'',photos:[]},got:{}};view='net';render();connect(n)}
/* Connexion directe entre les deux navigateurs avec PeerJS (serveur de mise en relation gratuit) */
function errTxt(e){const t=e&&e.type;return t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed'?'Connexion au serveur impossible. Vérifie ta connexion internet.':t==='browser-incompatible'?'Ce navigateur ne permet pas le jeu en ligne.':'Problème de connexion ('+(t||'inconnu')+').'}
function attach(n,c){n.conn=c;
 c.on('data',d=>{if(NET===n&&n.conn===c)onMsg({peer:c.peer,data:d})});
 c.on('close',()=>{if(NET===n&&n.conn===c){n.conn=null;lost(n)}});
 c.on('error',()=>{})}
function lost(n){const who=n.oppName||(n.role==='host'?'L’autre joueur':'L’hôte');
 if(n.role==='host'){Object.assign(n,{opp:null,oppName:'',pr:false,phase:'lobby',note:who+' a quitté la partie. En attente d’un autre joueur…'});if(n.g==='bs')n.pr=false}
 else{clearTimeout(n.tm);Object.assign(n,{opp:null,phase:'lobby',err:who+' a quitté la partie ou la connexion a été perdue.'})}
 render()}
function connect(n){
 if(typeof Peer==='undefined'){n.err='Impossible de charger le module de jeu en ligne. Vérifie ta connexion internet.';render();return}
 if(n.role==='host'){
  if(n.peer&&!n.peer.destroyed){if(n.peer.disconnected)try{n.peer.reconnect()}catch(e){}render();return}
  const p=n.peer=new Peer(PID(n.code));
  p.on('open',()=>{if(NET!==n)return;n.online=true;n.err='';render()});
  p.on('connection',c=>{if(NET!==n||n.conn){c.on('open',()=>c.close());return}attach(n,c)});
  p.on('disconnected',()=>{if(NET===n&&!p.destroyed)setTimeout(()=>{try{p.reconnect()}catch(e){}},1500)});
  p.on('error',e=>{if(NET!==n)return;if(e.type==='unavailable-id'){p.destroy();n.peer=null;n.code=mkCode();connect(n);return}if(e.type==='peer-unavailable')return;n.err=errTxt(e);render()})}
 else{

function renderNet(){const n=NET,G=GAMES[n.g],host=n.role==='host';let h='';
 if(host&&n.g==='qe'&&n.phase==='lobby'&&!n.deck.photos.length&&QE.okDecks().length){QE.init(n)}
 if(host&&n.online)h+=`<div class="codebox"><b>${n.show?esc(n.code):'•••••'}</b><button class="ib" onclick="NET.show=!NET.show;render()" aria-label="${n.show?'Masquer':'Afficher'} le code" title="${n.show?'Masquer':'Afficher'} le code">${n.show?'🙈':'👁️'}</button><button class="ib" onclick="copyCode()" aria-label="Copier le code" title="Copier le code">📋</button></div>${n.cp?`<span class="hint"> ${esc(n.cp)}</span>`:''}`;
 h+=`<div class="bar"><button onclick="leaveNet()">← Quitter</button><b>${esc(G.name)}</b></div>`;
 if(n.err)h+=`<div class="empty"><b>${esc(n.err)}</b><div class="bar" style="justify-content:center;margin:10px 0 0"><button onclick="retry()">Réessayer</button></div></div>`;
 if(n.phase==='lobby'){
  if(host){const can=n.pseudo.trim()&&n.opp&&n.pr;
   h+=`<div class="box"><label for="ps"><b>Ton pseudo</b></label><br><input id="ps" type="text" maxlength="16" placeholder="Ton pseudo" value="${esc(n.pseudo)}" autocomplete="off" oninput="NET.pseudo=this.value;render()" onchange="D.pseudo=this.value.trim();save()">`+(G.opts(n)?'<div style="margin-top:10px">'+G.opts(n)+'</div>':'')+'</div>'+
   (n.err?'':`<div class="empty">${n.opp?`<b>${esc(n.oppName)}</b> a rejoint la partie.`+(n.pr?'':n.g==='qe'&&!n.deck.photos.length?'<small>Ajoute d’abord au moins 2 photos : bouton « Ajouter des personnages » ci-dessous.</small>':'<small>Envoi des données…</small>'):!n.online?'Création de la partie…':esc(n.note||'En attente de l’autre joueur…')}</div>`)+`<div class="bar"><button class="go" onclick="launch()" ${can?'':'disabled'}>Lancer la partie</button>${n.g==='qe'?'<button onclick="addChars()">Ajouter des personnages</button>':''}</div>`+(n.opp&&!n.pseudo.trim()?'<p class="hint">Entre ton pseudo pour pouvoir lancer.</p>':'')}
  else{const ph=n.deck.photos,ok=ph.filter(p=>p.src).length;
   if(!n.err)h+=`<div class="empty">${!n.opp?'Connexion à la partie…':ph.length&&ok<ph.length?`Chargement des photos (${ok}/${ph.length})…`:'Connecté. En attente du lancement par l’hôte…'}</div>`}}
 else{let u=G.ui(n);const[bc,bt]=bannerFor(n),inPlay=!(n.g==='bs'&&n.bp!=='play'&&n.phase!=='over');
  if(!inPlay){n._bk='';h+=u}
  else{const take=re=>{const m=u.match(re);if(!m)return'';u=u.replace(m[0],'');return m[0]};
   const msg=take(/<p class="msg"[^>]*>[\s\S]*?<\/p>/),hint=n.g==='bs'?take(/<p class="hint">[\s\S]*?<\/p>/):'';
   let bh='';if(bt){const k=bc+bt;bh=`<div class="bwrap" aria-live="polite"><div class="banner ${bc}${n._bk===k?' nopop':''}">${esc(bt)}</div></div>`;n._bk=k}else{n._bk='';bh=msg}
   const blk=`<div class="bottom">${bh}</div>`,i=n.g==='qe'?u.lastIndexOf('<div class="grid'):-1;
   h+=i>=0?u.slice(0,i)+blk+u.slice(i):u+blk}}
 $('net').innerHTML=h}
function renderEdit(){
 const dk=D.decks.find(d=>d.id===D.cur);
 let h=(NET?'<div class="bar"><button class="go" onclick="go(\'net\')">← Retour à la partie en cours</button></div>':'')+'<h2>Mes Qui est-ce ?</h2><div class="bar">'+D.decks.map(d=>`<button class="${d.id===D.cur?'on':''}" onclick="D.cur='${d.id}';cd=0;save();render()">${esc(d.name)}</button>`).join('')+'</div>';
 h+='<div class="bar"><input id="nn" type="text" maxlength="24" placeholder="Nouveau jeu (ex : Famille)" onkeydown="if(event.key===\'Enter\')addDeck()"><button class="go" onclick="addDeck()">Créer le jeu</button></div>';
 if(!dk){h+='<div class="empty">Crée ton premier jeu, puis ajoute-lui des personnages.</div>'}
 else{h+=`<div class="box"><div class="bar"><input id="rn" type="text" maxlength="24" value="${esc(dk.name)}" aria-label="Nom du jeu" onchange="renDeck(this.value)"><label class="btn go">Ajouter des photos<input type="file" accept="image/*" multiple hidden onchange="addPhotos(this)"></label><button onclick="delDeck()">${cd?'Confirmer la suppression ?':'Supprimer le jeu'}</button></div>
 <p class="hint">Chaque photo est un personnage. Touche un nom pour le modifier. Tout est enregistré automatiquement sur cet appareil.</p>
 <div class="grid edit">`+(dk.photos.length?dk.photos.map(p=>`<div class="c"><button class="x" aria-label="Supprimer ${esc(p.name)}" onclick="delPhoto('${p.id}')">×</button><img src="${p.src}" alt=""><input type="text" value="${esc(p.name)}" aria-label="Nom" onchange="renPhoto('${p.id}',this.value)"></div>`).join(''):'<div class="empty" style="grid-column:1/-1">Ce jeu est vide. Ajoute des photos.</div>')+'</div></div>'}
 h+='<div class="box"><h2>Mot de passe admin</h2><div class="bar"><input id="np" type="password" autocomplete="off" placeholder="Nouveau mot de passe" aria-label="Nouveau mot de passe"><button onclick="changePw()">Changer</button></div><div class="hint" id="pm" aria-live="polite"></div></div>';
 $('edit').innerHTML=h;
}
init();
</script></body></html>
